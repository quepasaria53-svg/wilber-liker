
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WILBER LIKER</title>
<style>
body{background:#090909;color:white;font-family:Arial;text-align:center;margin:0}
header{background:#190609;padding:20px;border-bottom:2px solid #f14}
h1{color:#ff1744}
main{max-width:430px;margin:25px auto;padding:15px}
.panel{background:#1b1b1b;padding:20px;border-radius:15px;border:1px solid #f14;margin-bottom:15px}
input,button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:8px;box-sizing:border-box}
input{background:#303030;color:white}
button{background:#e50935;color:white;font-weight:bold}
small{color:#aaa}
</style>
</head>
<body>
<header>
<h1>WILBER LIKER</h1>
<p>Panel de usuarios</p>
</header>
<main>
<div class="panel">
<h2>Crear cuenta de prueba</h2>
<input id="nombre" placeholder="Tu nombre">
<button onclick="registrar()">Registrarme</button>
<p id="mensaje"></p>
</div>

<div class="panel">
<h2>Nueva solicitud</h2>
<input id="video" placeholder="Enlace de TikTok">
<button onclick="solicitar()">Guardar solicitud</button>
</div>

<div class="panel">
<h2>Historial</h2>
<div id="historial">Todavía no hay solicitudes.</div>
</div>
<small>WILBER LIKER © 2026<br>
Demo local: los datos no se guardan en un servidor y no genera vistas reales.</small>
</main>
<script>
let usuario="";
let solicitudes=[];

function registrar(){
 usuario=document.getElementById("nombre").value.trim();
 if(!usuario){alert("Escribe tu nombre");return;}
 document.getElementById("mensaje").textContent="¡Bienvenido, "+usuario+"!";
}
function solicitar(){
 if(!usuario){alert("Primero crea tu cuenta de prueba");return;}
 let video=document.getElementById("video").value.trim();
 if(!video.startsWith("https://")){alert("Introduce un enlace válido");return;}
 solicitudes.push(video);
 document.getElementById("historial").innerHTML="";
 solicitudes.forEach((v,i)=>{
 let p=document.createElement("p");
 p.textContent=(i+1)+". "+v;
 document.getElementById("historial").appendChild(p);
 });
 document.getElementById("video").value="";
}
</script>
</body>
</html>
